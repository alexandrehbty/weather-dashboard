name: GeoMeteo CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run unit tests
        env:
          PYTHONPATH: .
          API_KEY: "ci-unit-test-dummy-key"
        run: python -m pytest tests/test_unitaire.py -v

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-playwright pytest-rerunfailures pytest-base-url axe-playwright-python

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Start Flask and run E2E suite
        env:
          API_KEY: ${{ secrets.API_KEY }}
          PYTHONPATH: .
        run: |
          python app.py > flask_error.log 2>&1 &
          FLASK_PID=$!
          trap 'kill "$FLASK_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              break
            fi
            if ! kill -0 "$FLASK_PID" 2>/dev/null; then
              echo "=== Flask a plante au demarrage ==="
              cat flask_error.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:5000/health > /dev/null; then
            echo "=== Timeout au demarrage de Flask ==="
            cat flask_error.log
            exit 1
          fi

          python -m pytest e2e/test_e2e.py --base-url=http://127.0.0.1:5000 --reruns 2 -v || {
            echo "=== Logs Flask ==="
            cat flask_error.log
            exit 1
          }

  terraform-validate:
    name: Terraform Validate (${{ matrix.cloud }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cloud:
          - alibaba
          - aws
          - azure
          - gcp
          - hetzner
          - oracle
          - ovh
          - scaleway

    defaults:
      run:
        working-directory: terraform/${{ matrix.cloud }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Check HCL formatting
        run: terraform fmt -check -diff

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  build-and-push:
    name: Build & Push Docker Image
    needs: [unit-tests, e2e-tests, terraform-validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max